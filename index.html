
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#172b4d">
<meta name="description" content="Interaktiver Stellenwert-Trainer">
<link rel="manifest" href="manifest.json">
<title>Stellenwert-Trainer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172b4d}
.app{max-width:1100px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:4px 0}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:10px}
.reset{background:#dce5f2}
.main{background:white;border-radius:15px;padding:12px;margin:10px 0;text-align:center}
.number{font-size:clamp(48px,10vw,90px);font-weight:800;letter-spacing:3px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center}
.panel{background:white;padding:12px;border-radius:14px;margin:10px 0}
.names{font-size:clamp(10px,2vw,14px);color:#52647d;font-weight:bold}
.digit{font-size:clamp(27px,5vw,46px);font-weight:bold;padding:5px}
.control{width:100%;font-size:25px;font-weight:bold;background:#dce9ff;color:#174c96;min-height:43px}
.minus{background:#e8edf4;color:#263b58}
.parts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center;font-size:clamp(17px,3vw,24px);font-weight:bold}
.partrow{margin:8px 0}
.partvalue{font-size:13px;color:#61718a;text-align:right;margin-top:2px}
input{padding:10px;border:1px solid #b9c8da;border-radius:8px;width:100%;min-width:0}
.calc{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:7px}
.calc button{background:#dce9ff;font-weight:bold;font-size:20px}
#message{font-size:13px;color:#52647d;margin-top:8px}
@media(orientation:landscape){
 .app{padding:8px 16px}
 .main{padding:5px;margin:6px 0}
 .number{font-size:clamp(45px,9vh,75px)}
 .panel{padding:8px;margin:6px 0}
 .control{min-height:36px}
 .digit{padding:1px}
 .partrow{margin:3px 0}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div><h1>Stellenwert-Trainer</h1><small>Dezimalsystem bis 999.999</small></div>
 <button class="reset" id="reset">↺ Neustart</button>
</header>

<section class="main">
 <div style="font-size:13px;color:#61718a">AKTUELLE ZAHL</div>
 <div class="number" id="number" aria-live="polite">1.374</div>
</section>


<section class="panel" id="number-editor" style="display:none">
  <b>Neue Zahl eingeben</b>
  <input id="number-input"
         type="text"
         inputmode="none"
         readonly
         placeholder="Zahl eingeben"
         style="font-size:28px;text-align:center;font-weight:bold;margin:10px 0">

  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">
    <button class="control" data-key="1">1</button>
    <button class="control" data-key="2">2</button>
    <button class="control" data-key="3">3</button>
    <button class="control" data-key="4">4</button>
    <button class="control" data-key="5">5</button>
    <button class="control" data-key="6">6</button>
    <button class="control" data-key="7">7</button>
    <button class="control" data-key="8">8</button>
    <button class="control" data-key="9">9</button>
    <button class="control minus" data-key="clear">C</button>
    <button class="control" data-key="0">0</button>
    <button class="control minus" data-key="back">⌫</button>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
    <button class="control minus" id="cancel-edit">Abbrechen</button>
    <button class="control" id="apply-edit">Übernehmen</button>
  </div>
  <div id="edit-message" style="font-size:13px;margin-top:8px"></div>
</section>


<section class="panel">
 <div class="grid names" id="names"></div>
 <div class="grid" id="plus"></div>
 <div class="grid" id="digits"></div>
 <div class="grid" id="minus"></div>
 <div style="text-align:center;font-size:12px;color:#61718a;margin-top:7px">Plus erhöht · Minus verringert den jeweiligen Stellenwert</div>
</section>

<section class="panel">
 <b>Zerlegung der Zahl</b>
 <div id="parts" style="margin-top:8px"></div>
</section>

<section class="panel">
 <b>Rechenfeld</b>
 <div class="calc" style="margin-top:9px">
  <input id="operand" type="number" step="any" placeholder="Zweite Zahl" aria-label="Zweite Zahl">
  <button data-op="add">+</button>
  <button data-op="sub">−</button>
  <button data-op="mul">×</button>
  <button data-op="div">÷</button>
 </div>
 <div id="message">Zahl eingeben und Rechenart auswählen.</div>
</section>
</div>

<script>

const powers = [100000,10000,1000,100,10,1];
const labels = ['100.000er','10.000er','1.000er','Hunderter','Zehner','Einer'];

let value = 1374;

const fmt = n => Math.trunc(n).toLocaleString('de-DE');
const el = id => document.getElementById(id);

const editor = el('number-editor');
const numberInput = el('number-input');

// Zahl und Stellenwertdarstellung aktualisieren
function render() {
  el('number').textContent = fmt(value);

  el('names').innerHTML =
    labels.map(x => `<div>${x}</div>`).join('');

  el('plus').innerHTML = powers.map((p,i) =>
    `<button class="control" data-add="${i}">+</button>`
  ).join('');

  el('minus').innerHTML = powers.map((p,i) =>
    `<button class="control minus" data-sub="${i}">−</button>`
  ).join('');

  el('digits').innerHTML = powers.map(p =>
    `<div class="digit">${Math.floor(value/p)%10}</div>`
  ).join('');

  // Höchste belegte Stelle ermitteln
  const highest = powers.findIndex(p =>
    Math.floor(value/p)%10 !== 0
  );

  // Zerlegung mit korrekt ausgerichteten Nullstellen
  const rows = powers.map((p,i) => {
    if(highest === -1 || i < highest) return '';

    const digit = Math.floor(value/p)%10;
    const part = digit*p;

    const cells = powers.map((q,j) => {
      if(j < i) return '<div></div>';

      return `<div>${Math.floor(part/q)%10}</div>`;
    }).join('');

    return `
      <div class="partrow">
        <div class="parts">${cells}</div>
        <div class="partvalue">${fmt(part)}</div>
      </div>
    `;
  }).join('');

  el('parts').innerHTML =
    rows || '<div style="text-align:center">0</div>';
}

// Plus und Minus: Nur EIN Ereignislistener für die gesamte App
document.addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  const sub = e.target.closest('[data-sub]');

  if(add) {
    const p = powers[Number(add.dataset.add)];

    if(value+p <= 999999) {
      value += p;
      render();
    } else {
      el('message').textContent =
        'Die Höchstgrenze von 999.999 ist erreicht.';
    }
  }

  if(sub) {
    const p = powers[Number(sub.dataset.sub)];

    if(value >= p) {
      value -= p;
      render();
    } else {
      el('message').textContent =
        'Ein negativer Wert ist nicht möglich.';
    }
  }
});

// Neustart
el('reset').onclick = () => {
  value = 0;
  el('operand').value = '';
  el('message').textContent = 'Zahl zurückgesetzt.';
  render();
};

// Rechenarten
document.querySelectorAll('[data-op]').forEach(btn => {
  btn.onclick = () => {
    const raw = el('operand').value;

    if(raw.trim() === '') {
      el('message').textContent =
        'Bitte eine Zahl eingeben.';
      return;
    }

    const n = Number(raw);

    if(!Number.isFinite(n)) {
      el('message').textContent = 'Ungültige Zahl.';
      return;
    }

    let result;

    switch(btn.dataset.op) {
      case 'add':
        result = value+n;
        break;
      case 'sub':
        result = value-n;
        break;
      case 'mul':
        result = value*n;
        break;
      case 'div':
        if(n === 0) {
          el('message').textContent =
            'Division durch null ist nicht möglich.';
          return;
        }
        result = value/n;
        break;
    }

    if(!Number.isFinite(result) ||
       result < 0 || result > 999999) {
      el('message').textContent =
        'Ergebnis außerhalb des Zahlenbereichs 0 bis 999.999.';
      return;
    }

    value = Math.trunc(result);
    render();

    el('message').textContent =
      'Ergebnis: '+fmt(value);
  };
});

// Zahleneingabe öffnen
el('number').style.cursor = 'pointer';
el('number').title = 'Tippen zum Ändern';

el('number').addEventListener('click', () => {
  numberInput.value = String(value);
  editor.style.display = 'block';
  el('edit-message').textContent = '';
  numberInput.scrollIntoView({
    behavior:'smooth',
    block:'nearest'
  });
});

// Eigene Zifferntastatur
editor.addEventListener('click', e => {
  const key = e.target.closest('[data-key]');
  if(!key) return;

  let current = numberInput.value;
  const action = key.dataset.key;

  if(action === 'clear') {
    current = '';
  } else if(action === 'back') {
    current = current.slice(0,-1);
  } else if(current.length < 6) {
    current += action;
  }

  numberInput.value = current;
});

// Abbrechen
el('cancel-edit').onclick = () => {
  editor.style.display = 'none';
};

// Neue Zahl übernehmen
el('apply-edit').onclick = () => {
  const raw = numberInput.value.trim();
  const msg = el('edit-message');

  if(raw === '' || !/^\d+$/.test(raw)) {
    msg.textContent = 'Bitte eine gültige Zahl eingeben.';
    return;
  }

  const newValue = Number(raw);

  if(newValue > 999999) {
    msg.textContent = 'Maximal 999.999 erlaubt.';
    return;
  }

  value = newValue;
  render();

  editor.style.display = 'none';

  el('message').textContent =
    'Neue Zahl übernommen: '+fmt(value);
};

// App starten
render();

if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(console.error);
  });
}

</script>
</body>
</html>
